# Tool versions and common tasks. Run `mise install` once, then `mise run <task>`.
[tools]
node = "22.22.0"
pnpm = "10.34.7"
rust = { version = "1.97.0", components = "clippy,rustfmt" }

[tasks.install]
description = "Install frontend dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Run the app in development mode"
run = "pnpm tauri dev"

[tasks.build]
description = "Build the app installer"
run = "pnpm tauri build"

[tasks."check:web"]
description = "Typecheck, lint, format check and test the frontend"
run = ["pnpm typecheck", "pnpm lint", "pnpm format:check", "pnpm test"]

[tasks."check:rust"]
description = "Format check, lint and test the Rust crate"
dir = "src-tauri"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --locked -- -D warnings",
  "cargo test --locked",
]

[tasks."perf:library"]
description = "Measure capture-library performance (release build; prints the results)"
dir = "src-tauri"
run = "cargo test --release --locked --lib capture_library::perf_tests -- --ignored --nocapture --test-threads=1"

[tasks.check]
description = "Run every check that CI runs"
depends = ["check:web", "check:rust"]

[tasks.e2e]
description = "Build the E2E app and run the Windows E2E tests (needs a desktop; quit Snipt first)"
# Only this task needs tauri-driver, so CI and `mise install` do not build it.
tools = { "cargo:tauri-driver" = "2.1.0" }
# Its own target folder: the tests can never start a build without the feature (which would
# use the real settings), and `mise run dev` keeps its binary.
env = { CARGO_TARGET_DIR = "{{config_root}}/src-tauri/target/e2e" }
run = ["pnpm tauri build --debug --no-bundle --features e2e", "pnpm test:e2e"]
