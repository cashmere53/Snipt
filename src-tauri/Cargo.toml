[package]
name = "snipt"
version = "0.1.0"
description = "Screenshot and annotation tool for Windows"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "snipt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# --- app-shell ---
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- capture-library ---
# --- screen-capture ---
# --- annotation-editor ---

[target.'cfg(windows)'.dependencies]
# --- app-shell ---
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry"] }
# --- capture-library ---
# --- screen-capture ---
# --- annotation-editor ---

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
